name: GravityLAN CI

on:
  push:
    branches: [ main, master, feat/proxmox-integration ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests
      env:
        GRAVITYLAN_DATA_DIR: /tmp/gravitylan_test_data
      run: |
        cd backend
        python -m pytest

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install, typecheck, test and build
      run: |
        cd frontend
        npm ci
        npm run typecheck
        npm test
        npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-typecheck]
    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag gravitylan:ci

    - name: Smoke test the image
      run: |
        docker run -d --name gravitylan-ci -p 127.0.0.1:18000:8000 gravitylan:ci
        trap 'docker logs gravitylan-ci; docker rm -f -v gravitylan-ci' EXIT
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:18000/api/health > /tmp/gravitylan-health.json; then
            python -c 'import json; assert json.load(open("/tmp/gravitylan-health.json"))["status"] == "ok"'
            curl --fail --silent http://127.0.0.1:18000/ | grep -q '<!doctype html>'
            curl --fail --silent http://127.0.0.1:18000/api/setup/status | python -c 'import json,sys; assert json.load(sys.stdin)["is_setup_complete"] is False'
            exit 0
          fi
          sleep 2
        done
        exit 1

  publish-test-image:
    # Test images only; PRs and main/master never publish or replace a release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/proxmox-integration'
    needs: [lint-and-test, frontend-typecheck, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Determine image name
      id: image
      env:
        REPOSITORY: ${{ github.repository }}
      run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish Proxmox test image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.image.outputs.name }}:proxmox-test
          ${{ steps.image.outputs.name }}:proxmox-${{ github.sha }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
